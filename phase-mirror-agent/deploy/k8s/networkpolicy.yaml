apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phase-mirror-agent
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: phase-mirror-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from the Ingress controller (e.g., nginx)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
        - port: 3030
          protocol: TCP
    # Allow from Prometheus monitoring namespace for scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow the agent to reach external services
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32   # block cloud metadata (AWS/GCP)
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
