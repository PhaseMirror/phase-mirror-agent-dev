[workspace]
resolver = "2"
members = [
    "phase-mirror-agent",
    "phase-mirror-mcp",
    "phase-mirror-gpt",
    "phase-mirror-surface",
    "crates/verification-harness",
    "crates/lexlean-stratum",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
