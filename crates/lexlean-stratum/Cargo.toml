[package]
name = "lexlean-stratum"
version = "0.1.0"
edition = "2021"
description = "LexLean lexeme stratum and PIRTM §34 stratification runtime"
authors = ["Phase Mirror Authors"]
license = "MIT OR Apache-2.0"

[dependencies]
camino = "1.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
