name: Phase Mirror CI & MCP validation

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  workspace-ci:
    name: Workspace Verification & MCP Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace
        run: cargo check --workspace

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Phase Mirror MCP Server (Release)
        run: cargo build -p phase-mirror-mcp --release

      - name: Run MCP Server Test Suite
        run: cargo test -p phase-mirror-mcp
