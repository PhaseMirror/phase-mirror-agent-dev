[package]
name = "phase-mirror-surface"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Phase Mirror Contributors"]
license = "MIT OR Apache-2.0"
description = "Shared surface abstraction and data contracts for the Phase Mirror sovereign stack"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }
sha2 = "0.11"

[features]
default = ["std"]
std = ["ed25519-dalek"]
no-std = []
