[package]
name = "phase-mirror-mcp"
version = "1.0.0-alpha"
edition = "2024"

[dependencies]
verification-harness = { path = "../../../Foundry/tests/verification-harness" }
phase-mirror-gpt = { path = "../phase-mirror-gpt" }
phase-mirror-surface = { path = "../phase-mirror-surface" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
futures = "0.3"
tower = "0.4"
notify = "7.0"
arc-swap = "1.7"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"

[features]
default = []
lmstudio = []
