name: Phase Mirror MCP Automation

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Allowlisted command. Arbitrary cargo is refused."
        required: true
        type: choice
        options:
          - build
          - test
          - validate
          - check-contract

jobs:
  dispatch:
    name: Execute MCP Automation Command
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run allowlisted command
        run: |
          set -euo pipefail
          case "${{ inputs.command }}" in
            build)
              cargo build -p phase-mirror-mcp --release
              ;;
            test)
              cargo test -p phase-mirror-mcp
              ;;
            validate)
              cargo check --workspace
              cargo test --workspace
              ;;
            check-contract)
              cargo test -p phase-mirror-mcp --test runtime_harness
              cargo test -p lexlean-stratum
              ;;
            *)
              echo "refused: command is not allowlisted" >&2
              exit 1
              ;;
          esac
