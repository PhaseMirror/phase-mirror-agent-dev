apiVersion: v1
kind: Service
metadata:
  name: {{ include "phase-mirror-agent.fullname" . }}
  labels:
    {{- include "phase-mirror-agent.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "phase-mirror-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: ws
      port: {{ .Values.service.wsPort }}
      targetPort: ws
      protocol: TCP
